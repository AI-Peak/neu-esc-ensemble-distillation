<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><style>text{font-family:Arial,sans-serif;fill:#17202a}.box{fill:#eaf2f8;stroke:#2874a6;stroke-width:2}.task{fill:#fef5e7;stroke:#ca6f1e;stroke-width:2}.arrow{stroke:#34495e;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker></defs><text x="600" y="35" text-anchor="middle" font-size="26" font-weight="bold">NEU-ESC Adaptive Interaction</text><rect class="box" x="470" y="60" width="260" height="55" rx="10"/><text x="600" y="95" text-anchor="middle" font-size="18">Student feedback + PhoBERT</text><path class="arrow" d="M600 115 L600 155"/><rect class="box" x="470" y="155" width="260" height="55" rx="10"/><text x="600" y="190" text-anchor="middle" font-size="18">Shared contextual H</text><path class="arrow" d="M600 210 L390 270"/><path class="arrow" d="M600 210 L810 270"/><rect class="box" x="220" y="270" width="340" height="70" rx="10"/><text x="390" y="300" text-anchor="middle" font-size="17">h_s = task projection</text><text x="390" y="324" text-anchor="middle" font-size="15">sentiment representation</text><rect class="box" x="640" y="270" width="340" height="70" rx="10"/><text x="810" y="300" text-anchor="middle" font-size="17">h_a = task projection</text><text x="810" y="324" text-anchor="middle" font-size="15">topic representation</text><path class="arrow" d="M560 305 C600 340 600 370 640 305"/><path class="arrow" d="M640 325 C600 360 600 390 560 325"/><rect class="task" x="220" y="390" width="340" height="75" rx="10"/><text x="390" y="422" text-anchor="middle" font-size="17">g_s = sigmoid(W_s[h_s;h_a])</text><text x="390" y="447" text-anchor="middle" font-size="15">z_s = LN(h_s + g_s ⊙ T_s(h_a))</text><rect class="task" x="640" y="390" width="340" height="75" rx="10"/><text x="810" y="422" text-anchor="middle" font-size="17">g_a = sigmoid(W_a[h_a;h_s])</text><text x="810" y="447" text-anchor="middle" font-size="15">z_a = LN(h_a + g_a ⊙ T_a(h_s))</text><path class="arrow" d="M390 465 L390 520"/><path class="arrow" d="M810 465 L810 520"/><rect class="box" x="220" y="520" width="340" height="55" rx="10"/><text x="390" y="554" text-anchor="middle" font-size="18">Sentiment head (4 labels)</text><rect class="box" x="640" y="520" width="340" height="55" rx="10"/><text x="810" y="554" text-anchor="middle" font-size="18">Topic head (10 labels)</text></svg>